<style>

  /* Leaderboard — Moodle table style */

  .lb-rank {

  /* Review */
  .review-item {
    padding: 6px 10px;

  }
  .review-correct { background: #dff0d8; border-color: #d6e9c6; }
  .review-wrong { background: #f2dede; border-color: #ebccd1; }
  .review-icon { font-size: 14px; margin-right: 8px; }

  /* Category stats — Moodle bar style */
  .cat-stats { margin-top: 16px; }
  .cat-stats h3 { font-size: 1em; font-weight: 600; margin-bottom: 8px; }
  .cat-bar-container {
    display: flex;

  /* Admin links */

  @media (max-width: 600px) {

<body>

<div class="navbar">
  <span>Ambient Noise Seismology</span>
  <span></span>
</div>

<div class="container">
  <h1>Quiz: Ambient Noise Seismology</h1>
  <p class="subtitle">21 questions</p>

  <!-- Registration -->
  <div id="registration">
    <h2>Attempt quiz</h2>
    <p style="margin-bottom:15px;color:#6a737b;font-size:13px;">Enter your full name to begin.</p>
    <div style="margin-bottom:8px;">
      <label for="nameInput" style="font-size:13px;font-weight:600;display:block;margin-bottom:4px;text-align:left;max-width:280px;margin-left:auto;margin-right:auto;">Full name</label>
      <input type="text" id="nameInput" placeholder="First Last" autofocus>
    </div>
    <button class="btn btn-primary" onclick="startQuiz()" id="startBtn">Attempt quiz now</button>
    <div class="admin-toggle">
      <a onclick="toggleLeaderboard()">View previous attempts</a>
    </div>
    <div id="preLeaderboard" style="display:none;margin-top:15px;"></div>
  </div>

  <!-- Quiz -->
  <div id="quiz" style="display:none;">
    <div class="progress-text">
      <span id="progressLabel">Question 1 of 21</span>
      <span id="scoreLabel">Score: 0</span>
    </div>
    <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
    <div id="questionContainer"></div>
    <div class="nav-buttons">
      <button class="btn btn-secondary" id="prevBtn" onclick="prevQuestion()" disabled>&laquo; Previous page</button>
      <button class="btn btn-primary" id="nextBtn" onclick="nextQuestion()">Next page &raquo;</button>
    </div>
  </div>

  <!-- Results -->
  <div id="results"></div>
</div>

<script>
const questions = [
  // --- CROSS-CORRELATION & LAG TIME ---
  {
    category: "Cross-Correlation",
    question: "Two stations are 90 km apart. If the Rayleigh wave travels at 3 km/s, at what lag time do you expect to see the main arrival on the cross-correlation function (CCF)?",
    options: ["15 s", "30 s", "45 s", "90 s"],
    correct: 1,
    explanation: "Lag time = distance / velocity = 90 km / 3 km/s = 30 s. The CCF shows peaks at positive and negative lag times corresponding to waves traveling in both directions between the stations."
  },
  {
    category: "Cross-Correlation",
    question: "What is a cross-correlation compared to a convolution?",
    options: [
      "Cross-correlation measures similarity vs. time shift; convolution is the same but time-reversed",
      "Cross-correlation multiplies signals in the frequency domain; convolution adds them directly",
      "They are mathematically identical operations that always produce the exact same output",
      "Convolution measures waveform similarity over time; cross-correlation applies a spectral filter"
    ],
    correct: 0,
    explanation: "Cross-correlation slides one signal over another to measure similarity at each lag. Convolution does the same but with one signal time-reversed (or equivalently, conjugated in the frequency domain). In the frequency domain: correlation = A* x B, convolution = A x B."
  },
  {
    category: "Cross-Correlation",
    question: "Why do we stack (average) many daily cross-correlations?",
    options: [
      "To increase the effective sampling rate of the recorded continuous signal",
      "To convert velocity seismograms into displacement seismograms automatically",
      "To reduce incoherent noise and enhance the coherent Green's function",
      "To remove the instrument response from each individual daily record"
    ],
    correct: 2,
    explanation: "Individual daily CCFs are noisy. Stacking hundreds of days reinforces the temporally stable signal while incoherent noise cancels out, improving the SNR. With sufficient stacking and a well-distributed noise source field, the result converges toward the empirical Green's function (EGF) between the two stations."
  },
  {
    category: "Cross-Correlation",
    question: "What is a famous example of convolution in seismology?",
    options: [
      "The Fourier transform that converts a seismogram from time domain to frequency domain",
      "The recorded seismogram as convolution of source, Green's function, and instrument response",
      "The cross-correlation of continuous noise records computed between two seismic stations",
      "The deconvolution of the instrument response applied to recover true ground displacement"
    ],
    correct: 1,
    explanation: "u(t) = s(t) * G(t) * I(t) — the recorded seismogram u(t) is the convolution of the source s(t), the Green's function G(t), and the instrument response I(t). This is the fundamental equation of observational seismology."
  },
  // --- GREEN'S FUNCTION ---
  {
    category: "Green's Function",
    question: "What is a Green's function in the context of seismology?",
    options: [
      "The frequency response curve that characterizes a seismometer's bandwidth and sensitivity",
      "The background noise power spectrum measured at a quiet seismic station site",
      "The transfer function of the analog-to-digital converter inside the digitizer unit",
      "The impulse response of the Earth — the signal from a perfect point source"
    ],
    correct: 3,
    explanation: "The Green's function is the Earth's impulse response: the complete displacement field produced by an impulsive point force at one location, as recorded at another. It encodes all propagation effects (velocity structure, attenuation, scattering). In ambient noise seismology, cross-correlating long continuous records between two stations retrieves an estimate of this function (empirical Green's function, EGF)."
  },
  // --- WAVELENGTH & DISPERSION ---
  {
    category: "Dispersion",
    question: "A Rayleigh wave has a period of 5 s and travels at 3.2 km/s. What is its wavelength?",
    options: ["0.64 km", "1.6 km", "8 km", "16 km"],
    correct: 3,
    explanation: "Wavelength λ = velocity × period = 3.2 km/s × 5 s = 16 km. Longer periods yield longer wavelengths, and surface waves with longer wavelengths have depth sensitivity kernels that extend deeper into the Earth."
  },
  {
    category: "Dispersion",
    question: "What does 'dispersion' mean for surface waves?",
    options: [
      "Different frequencies travel at different velocities, causing the waveform to spread",
      "The wave amplitude decreases with distance due to geometrical spreading effects",
      "The wave changes propagation direction when it crosses a layer boundary",
      "The wave polarization rotates progressively as it penetrates into deeper layers"
    ],
    correct: 0,
    explanation: "Surface wave dispersion means phase velocity depends on frequency (or period). Longer-period waves have deeper sensitivity kernels and sample faster material at depth, so they propagate faster and arrive earlier. This frequency-dependent velocity is what we measure as a dispersion curve c(T)."
  },
  {
    category: "Dispersion",
    question: "Are body waves (P, S) dispersive in a homogeneous medium?",
    options: [
      "Yes — body waves are always dispersive regardless of the medium properties",
      "Only P waves are dispersive; S waves travel at a constant velocity",
      "No — all frequencies travel at the same velocity in a homogeneous medium",
      "Only at frequencies above 1 Hz where attenuation causes velocity changes"
    ],
    correct: 2,
    explanation: "In a homogeneous medium, body waves propagate at a single velocity regardless of frequency (non-dispersive). Surface waves are dispersive because their sensitivity kernels extend to different depths depending on wavelength; in a vertically heterogeneous Earth, this means each frequency samples a different effective velocity."
  },
  // --- RAYLEIGH WAVE PARTICLE MOTION ---
  {
    category: "Wave Physics",
    question: "Rayleigh waves produce particle motion in which plane?",
    options: [
      "The vertical-radial (sagittal) plane, parallel to the propagation direction",
      "The horizontal transverse plane, perpendicular to the propagation direction",
      "Purely vertical motion with no horizontal component at any depth",
      "Random three-dimensional motion that varies with source distance"
    ],
    correct: 0,
    explanation: "Rayleigh waves have retrograde elliptical particle motion in the sagittal plane (vertical + radial direction of propagation). Love waves have transverse horizontal motion. This is why Rayleigh waves appear on Z and R components, and Love waves on T."
  },
  {
    category: "Wave Physics",
    question: "On which seismogram components do you measure Rayleigh wave dispersion, and on which do you measure Love wave dispersion?",
    options: [
      "Rayleigh on Z and R (radial); Love on T (transverse)",
      "Rayleigh on T (transverse); Love on Z and R (radial)",
      "Both on the Z (vertical) component only, regardless of wave type",
      "Rayleigh on E (east); Love on N (north) in geographic coordinates"
    ],
    correct: 0,
    explanation: "Rayleigh waves move in the vertical-radial plane (ZR), Love waves move in the transverse plane (T). After rotating horizontal components to R and T using the station-pair azimuth, ZZ and RR give Rayleigh dispersion, TT gives Love dispersion."
  },
  // --- PREPROCESSING ---
  {
    category: "Preprocessing",
    question: "What is the typical preprocessing sequence for ambient noise data before cross-correlation?",
    options: [
      "Decimate, cross-correlate, remove trend, bandpass filter, then apply gain correction",
      "Remove response, detrend, demean, bandpass, temporal normalization, spectral whitening",
      "Stack all raw traces into a single stream, threshold to remove noise, then filter",
      "Apply gain correction, rotate components, compute cross-correlations, then detrend"
    ],
    correct: 1,
    explanation: "Standard workflow: (1) remove instrument response, (2) detrend & demean, (3) bandpass filter, (4) temporal normalization (e.g., 1-bit or running absolute mean) to suppress earthquakes and transients, (5) spectral whitening to broaden the usable frequency band."
  },
  {
    category: "Preprocessing",
    question: "What is the purpose of temporal normalization (e.g., 1-bit normalization) in ambient noise processing?",
    options: [
      "To increase the effective sampling rate of the continuous data stream for better resolution",
      "To convert the recorded data from velocity units to displacement units before correlation",
      "To correct for instrument clock drift that accumulates over long continuous recording periods",
      "To suppress high-amplitude transients like earthquakes so ambient noise dominates the signal"
    ],
    correct: 3,
    explanation: "Temporal normalization (1-bit, running absolute mean, etc.) suppresses amplitude variations from earthquakes and other transients that would otherwise bias the cross-correlation. By equalizing amplitudes, the diffuse ambient noise wavefield dominates, enabling convergence toward the empirical Green's function upon stacking."
  },
  // --- PPSD, NOISE MODELS ---
  {
    category: "Noise & Instruments",
    question: "In a PPSD (Probabilistic Power Spectral Density) plot, what do the two reference curves NHNM and NLNM represent?",
    options: [
      "Global upper and lower bounds of expected ambient seismic noise across all frequencies",
      "The maximum and minimum noise levels recorded at a single station over one year",
      "The noise thresholds that trigger automatic earthquake detection algorithms on the station",
      "The horizontal and vertical component noise levels measured during station site certification"
    ],
    correct: 0,
    explanation: "NHNM (New High Noise Model) and NLNM (New Low Noise Model) are global reference curves compiled from hundreds of stations worldwide. A well-functioning station should have its noise level between these two curves."
  },
  // --- INSTRUMENT RESPONSE ---
  {
    category: "Noise & Instruments",
    question: "What is the 'instrument response' of a seismometer?",
    options: [
      "The time the seismometer needs to warm up and stabilize after installation on site",
      "The transfer function describing how ground motion becomes an electrical signal vs. frequency",
      "The maximum ground acceleration the sensor can record before its output signal clips",
      "The noise floor of the digitizer that sets the smallest detectable ground motion level"
    ],
    correct: 1,
    explanation: "The instrument response describes the frequency-dependent amplification and phase shift between true ground motion and the recorded output. Removing it (deconvolution) recovers true ground motion in physical units (m/s or m/s^2)."
  },
  {
    category: "Noise & Instruments",
    question: "What does the 'corner frequency' (or corner period) of a broadband seismometer define?",
    options: [
      "The frequency above which the sensor saturates and clips the output signal",
      "The sampling rate at which the digitizer converts analog to digital counts",
      "The frequency below which the sensor response rolls off and fidelity is lost",
      "The frequency at which the sensor reaches its peak electrical sensitivity"
    ],
    correct: 2,
    explanation: "The corner period defines the longest period the sensor can faithfully record. Below this frequency (or above this period), the sensor response drops off rapidly and the recorded amplitudes are no longer accurate."
  },
  {
    category: "Noise & Instruments",
    question: "Many broadband seismometers have a corner period of ~120 s (0.0083 Hz). Why is this value so widespread?",
    options: [
      "It matches the dominant frequency of local earthquakes recorded in urban areas",
      "It is required by the SEED data format standard for all broadband instruments",
      "It captures teleseismic surface waves, Earth's free oscillations, and long-period signals",
      "It minimizes mechanical wear on the sensor's internal mass and spring system"
    ],
    correct: 2,
    explanation: "A 120 s corner period means the sensor is flat down to ~0.008 Hz, essential for recording teleseisms, long-period surface waves used in tomography, and Earth's normal modes. Short-period sensors (e.g., 1 Hz corner) miss these signals entirely."
  },
  // --- CHANNEL NAMING ---
  {
    category: "Noise & Instruments",
    question: "In the SEED channel naming convention (e.g., BHZ), what does the first letter represent?",
    options: [
      "The band code indicating sampling rate (B ≈ 20 sps, H ≈ 100 sps)",
      "The sensor type such as Broadband, High-gain, or Extremely short-period",
      "The orientation of the component (B = bottom, H = horizontal, Z = vertical)",
      "The network code identifying which institution operates the seismic station"
    ],
    correct: 0,
    explanation: "First letter = band/sampling rate: B (~10-80 sps), H (~80-250 sps), E (~80-250 sps, short-period), S (~10-80 sps, short-period), D (~250-1000 sps), L (~1 sps). Second letter = instrument type (H = high-gain seismometer, N = accelerometer). Third = orientation (Z, N, E or 1, 2, 3)."
  },
  {
    category: "Noise & Instruments",
    question: "What is the difference between channel codes HHZ and HNZ?",
    options: [
      "HHZ is sampled at a higher rate than HNZ due to different digitizer settings",
      "HHZ records the vertical component; HNZ records the north horizontal component instead",
      "HHZ uses a broadband sensor; HNZ uses a narrowband geophone at the same station site",
      "HHZ is a high-gain velocity sensor; HNZ is a strong-motion accelerometer, both ~100 sps"
    ],
    correct: 3,
    explanation: "The second letter: H = High-gain seismometer (velocity, very sensitive, clips during strong motion), N = accelerometer (measures acceleration, lower sensitivity but handles strong motion). Both with H as first letter = ~100 sps sampling."
  },
  {
    category: "Noise & Instruments",
    question: "Why do many short-period geophones have a corner frequency of 2 Hz (or 4.5 Hz)?",
    options: [
      "To save battery power in the field by limiting the bandwidth of recorded data",
      "Because ambient noise below 2 Hz is too weak for any useful seismic application",

const BACKEND_URL = 'https://script.google.com/macros/s/AKfycbynR0DpAsy85T5fq_tarbcnUgWO0Z18o1MdED6V1DiWaoDtM1qENenJ9BmACHJD7NxRoA/exec';
// ============================================================

let currentQ = 0;
let answers = new Array(questions.length).fill(null);
let answered = new Array(questions.length).fill(false);
let playerName = "";
let timerInterval = null;
let startTime = 0;
let timeRemaining = 15 * 60; // 15 minutes
let remoteLeaderboard = [];

function hasBackend() { return BACKEND_URL.length > 0; }

async function fetchLeaderboard() {
  if (!hasBackend()) return JSON.parse(localStorage.getItem('ant_quiz_leaderboard') || '[]');
  try {
    const resp = await fetch(BACKEND_URL);
    const data = await resp.json();
    remoteLeaderboard = data;
    return data;
  } catch (err) {
    console.warn('Backend fetch failed, using localStorage', err);
    return JSON.parse(localStorage.getItem('ant_quiz_leaderboard') || '[]');
  }
}

async function saveToBackend(entry) {
  // Always save locally
  let lb = JSON.parse(localStorage.getItem('ant_quiz_leaderboard') || '[]');
  lb.push(entry);
  lb.sort((a, b) => b.pct - a.pct || a.time - b.time);
  localStorage.setItem('ant_quiz_leaderboard', JSON.stringify(lb));

  if (!hasBackend()) return lb;

  try {
    await fetch(BACKEND_URL, {
      method: 'POST',
      mode: 'no-cors',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(entry)
    });
    // Fetch updated leaderboard after save
    await new Promise(r => setTimeout(r, 1500)); // wait for sheet to update
    return await fetchLeaderboard();
  } catch (err) {
    console.warn('Backend save failed, using localStorage', err);
    return lb;
  }
}

function startQuiz() {
  playerName = document.getElementById('nameInput').value.trim();
  if (!playerName) {
    document.getElementById('nameInput').style.borderColor = '#e74c3c';
    document.getElementById('nameInput').placeholder = 'Please enter your name!';
    return;
  }
  document.getElementById('registration').style.display = 'none';
  document.getElementById('quiz').style.display = 'block';
  startTime = Date.now();
  showQuestion(0);
}

function updateTimer() {
  timeRemaining--;
  let m = Math.floor(timeRemaining / 60);
  let s = timeRemaining % 60;
  let timerEl = document.getElementById('timer');
  timerEl.textContent = `${m}:${s.toString().padStart(2, '0')}`;
  if (timeRemaining <= 120) timerEl.classList.add('warning');
  if (timeRemaining <= 0) {
    clearInterval(timerInterval);
    finishQuiz();
  }
}

function showQuestion(idx) {
  currentQ = idx;
  const q = questions[idx];
  const letters = ['A', 'B', 'C', 'D'];

  document.getElementById('progressLabel').textContent = `Question ${idx + 1} of ${questions.length}`;
  document.getElementById('progressFill').style.width = `${((idx + 1) / questions.length) * 100}%`;
  document.getElementById('scoreLabel').textContent = `Score: ${answers.filter((a, i) => a === questions[i].correct).length}`;

  let html = `<div class="question-card">
    <span class="q-number">${idx + 1}</span>
    <span class="q-category">${q.category}</span>
    <div class="q-text">${q.question}</div>
    <div class="options">`;

  q.options.forEach((opt, i) => {
    let cls = 'option';
    if (answered[idx]) {
      if (i === q.correct) cls += ' correct';
      else if (i === answers[idx] && i !== q.correct) cls += ' wrong';
      cls += ' disabled';
    } else if (answers[idx] === i) {
      cls += ' selected';
    }
    html += `<div class="${cls}" onclick="selectAnswer(${idx}, ${i})">
      <span class="option-letter">${letters[i]}</span>
      <span>${opt}</span>
    </div>`;
  });

  html += `</div>`;

  if (answered[idx]) {
    const isCorrect = answers[idx] === q.correct;
    html += `<div class="explanation show ${isCorrect ? 'correct-exp' : 'wrong-exp'}">
      ${isCorrect ? '&#x2705;' : '&#x274c;'} ${q.explanation}
    </div>`;
  }

  html += `</div>`;
  document.getElementById('questionContainer').innerHTML = html;

  document.getElementById('prevBtn').disabled = idx === 0;
  const nextBtn = document.getElementById('nextBtn');
  if (idx === questions.length - 1) {
    nextBtn.textContent = 'Submit all and finish';
    nextBtn.onclick = finishQuiz;
  } else {
    nextBtn.innerHTML = 'Next page &raquo;';
    nextBtn.onclick = nextQuestion;
  }
}

function selectAnswer(qIdx, optIdx) {
  if (answered[qIdx]) return;
  answers[qIdx] = optIdx;
  answered[qIdx] = true;
  showQuestion(qIdx);
}

function nextQuestion() {
  if (currentQ < questions.length - 1) showQuestion(currentQ + 1);
}

function prevQuestion() {
  if (currentQ > 0) showQuestion(currentQ - 1);
}

async function finishQuiz() {
  clearInterval(timerInterval);
  const elapsed = Math.round((Date.now() - startTime) / 1000);
  const score = answers.filter((a, i) => a === questions[i].correct).length;
  const pct = Math.round((score / questions.length) * 100);
  const minutes = Math.floor(elapsed / 60);
  const seconds = elapsed % 60;

  // Show loading state
  document.getElementById('quiz').style.display = 'none';
  document.getElementById('results').style.display = 'block';
  document.getElementById('results').innerHTML = `<div style="text-align:center;padding:30px;">
    <h2 style="font-size:1.15em;">Submitting attempt...</h2>
    <p style="color:#6a737b;font-size:13px;">Saving your results</p></div>`;

  // Save to backend + localStorage
  const entry = { name: playerName, score, total: questions.length, pct, time: elapsed, date: new Date().toISOString() };
  const lb = await saveToBackend(entry);

  // Determine score class
  let scoreClass = 'score-needs-work';
  let msg = 'Please review the course material and try again.';
  if (pct >= 80) { scoreClass = 'score-excellent'; msg = 'Excellent! You have a strong grasp of the material.'; }
  else if (pct >= 60) { scoreClass = 'score-good'; msg = 'Good effort! Review the topics you missed.'; }

  // Category stats
  let catStats = {};
  questions.forEach((q, i) => {
    if (!catStats[q.category]) catStats[q.category] = { correct: 0, total: 0 };
    catStats[q.category].total++;
    if (answers[i] === q.correct) catStats[q.category].correct++;
  });

  let html = `<h2 style="font-size:1.15em;">Review attempt: ${playerName}</h2>
    <table style="width:100%;border-collapse:collapse;margin:12px 0;font-size:13px;">
      <tr style="border-bottom:1px solid #ddd;">
        <td style="padding:6px 0;color:#6a737b;">Grade</td>
        <td style="padding:6px 0;font-weight:600;">${score} out of ${questions.length} (${pct}%)</td>
      </tr>
      <tr style="border-bottom:1px solid #ddd;">
        <td style="padding:6px 0;color:#6a737b;">Time taken</td>
        <td style="padding:6px 0;">${minutes}m ${seconds}s</td>
      </tr>
      <tr>
        <td style="padding:6px 0;color:#6a737b;">Feedback</td>
        <td style="padding:6px 0;">${msg}</td>
      </tr>
    </table>
    <div class="score-circle ${scoreClass}">
      ${pct}%
      <span class="label">${score}/${questions.length}</span>
    </div>`;

  // Category breakdown
  html += `<div class="cat-stats"><h3>Score by Topic</h3>`;
  for (let cat in catStats) {
    const s = catStats[cat];
    const p = Math.round((s.correct / s.total) * 100);
    const color = p >= 80 ? '#27ae60' : p >= 50 ? '#f39c12' : '#e74c3c';
    html += `<div class="cat-bar-container">
      <span class="cat-label">${cat}</span>
      <div class="cat-bar-bg"><div class="cat-bar-fill" style="width:${p}%;background:${color};"></div></div>
      <span class="cat-bar-text">${s.correct}/${s.total}</span>
    </div>`;
  }
  html += `</div>`;

  // Answer review
  html += `<div style="margin-top:25px;"><h3>Answer Review</h3>`;
  questions.forEach((q, i) => {
    const correct = answers[i] === q.correct;
    const letters = ['A', 'B', 'C', 'D'];
    const yourAns = answers[i] !== null ? letters[answers[i]] : '\u2014';
    const correctAns = letters[q.correct];
    html += `<div class="review-item ${correct ? 'review-correct' : 'review-wrong'}">
      <span class="review-icon">${correct ? '&#x2705;' : '&#x274c;'}</span>
      <span>Q${i+1}: ${correct ? 'Correct' : `You: ${yourAns}, Answer: ${correctAns}`}</span>
      <span class="review-cat">${q.category}</span>
    </div>`;
  });
  html += `</div>`;

  // Leaderboard
  const backendLabel = hasBackend() ? '' : ' (local browser only)';
  html += `<div class="leaderboard" id="leaderboardSection"><h3>All attempts${backendLabel}</h3>`;
  lb.forEach((e, i) => {
    const isCurrent = e.name === playerName && Math.abs(e.pct - pct) < 1 && Math.abs(e.time - elapsed) < 5;
    const t = `${Math.floor(e.time/60)}m${(e.time%60).toString().padStart(2,'0')}s`;
    const medal = `${i+1}.`;
    html += `<div class="lb-entry ${isCurrent ? 'current' : ''}">
      <span class="lb-rank">${medal}</span>
      <span class="lb-name">${e.name}</span>
      <span class="lb-score">${e.pct}%</span>
      <span class="lb-time">${t}</span>
    </div>`;
  });
  html += `</div>`;

  // Controls
  html += `<div class="admin-toggle">
    <a onclick="refreshLeaderboard()">Refresh results</a>
    &nbsp;|&nbsp;<a onclick="location.reload()">Re-attempt quiz</a>
    &nbsp;|&nbsp;<a onclick="clearLeaderboard()">Clear local data</a>
  </div>`;

  document.getElementById('results').innerHTML = html;
}

async function refreshLeaderboard() {
  const section = document.getElementById('leaderboardSection');
  if (!section) return;
  section.innerHTML = '<h3>Loading...</h3>';
  const lb = await fetchLeaderboard();
  let html = `<h3>All attempts (${lb.length})</h3>`;
  lb.forEach((e, i) => {
    const t = `${Math.floor(e.time/60)}m${(e.time%60).toString().padStart(2,'0')}s`;
    const medal = `${i+1}.`;
    const isCurrent = e.name === playerName;
    html += `<div class="lb-entry ${isCurrent ? 'current' : ''}">
      <span class="lb-rank">${medal}</span>
      <span class="lb-name">${e.name}</span>
      <span class="lb-score">${e.pct}%</span>
      <span class="lb-time">${t}</span>
    </div>`;
  });
  section.innerHTML = html;
}

async function toggleLeaderboard() {
  const el = document.getElementById('preLeaderboard');
  if (el.style.display === 'none') {
    el.innerHTML = '<p style="color:#7f8c8d;">Loading...</p>';
    el.style.display = 'block';
    const lb = await fetchLeaderboard();
    if (lb.length === 0) {
      el.innerHTML = '<p style="color:#6a737b;font-size:13px;">No attempts recorded yet.</p>';
    } else {
      let html = '<div class="leaderboard"><h3>Previous attempts (' + lb.length + ')</h3>';
      lb.forEach((e, i) => {
        const t = `${Math.floor(e.time/60)}m${(e.time%60).toString().padStart(2,'0')}s`;
        const medal = `${i+1}.`;
        html += `<div class="lb-entry">
          <span class="lb-rank">${medal}</span>
          <span class="lb-name">${e.name}</span>
          <span class="lb-score">${e.pct}%</span>
          <span class="lb-time">${t}</span>
        </div>`;
      });
      html += '</div>';
      el.innerHTML = html;
    }
  } else {
    el.style.display = 'none';
  }
}

function clearLeaderboard() {
  if (confirm('Clear local leaderboard data?')) {
    localStorage.removeItem('ant_quiz_leaderboard');
    location.reload();
  }
}

// Enter key starts quiz
document.getElementById('nameInput').addEventListener('keypress', function(e) {
  if (e.key === 'Enter') startQuiz();
});
</script>

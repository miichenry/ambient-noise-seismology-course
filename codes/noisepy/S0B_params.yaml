# useful parameters for cleaning the data
input_fmt: 'mseed'  # input file format between 'sac' and 'mseed' 
samp_freq: 25     # targeted sampling rate
stationxml: False   # station.XML file exists or not
rm_resp: 'no'        # select 'no' to not remove response and use 'inv','spectrum','RESP', or 'polozeros' to remove response
respdir: '/home/users/j/jiwanibr/Projects/02_Supreme1/NANT/NoisePy-ant-main/smartsolo/resp_ML' # directory where resp files are located (required if rm_resp is neither 'no' nor 'inv')
